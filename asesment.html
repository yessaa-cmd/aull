<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <form>
      <table border="1" cellspacing="0" cellpadding="10" align="center">
        <tr>
          <td>
            <h1 align="center">FORM DATA SISWA</h1>
            <hr />

            <table cellpadding="3">
              <tr>
                <td>Username</td>
                <td>:</td>
                <td><input type="text" /></td>
              </tr>

              <tr>
                <td>Password</td>
                <td>:</td>
                <td><input type="password" /></td>
              </tr>

              <tr>
                <td>Nama Lengkap</td>
                <td>:</td>
                <td><input type="text" /></td>
              </tr>

              <tr>
                <td>No. Handphone</td>
                <td>:</td>
                <td><input type="text" /></td>
              </tr>

              <tr>
                <td>E-mail</td>
                <td>:</td>
                <td><input type="text" /></td>
              </tr>

              <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>
                  <input type="radio" name="jk" /> Laki-laki
                  <input type="radio" name="jk" /> Perempuan
                </td>
              </tr>

              <tr>
                <td>Hobi</td>
                <td>:</td>
                <td>
                  <input type="checkbox" /> Membaca<br />
                  <input type="checkbox" /> Menyanyi<br />
                  <input type="checkbox" /> Olahraga
                </td>
              </tr>

              <tr>
                <td>Kompetensi Keahlian</td>
                <td>:</td>
                <td>
                  <select>
                    <option>Rekayasa Perangkat Lunak</option>
                    <option>Manajemen Perkantoran</option>
                    <option>Layanan Perbankan</option>
                    <option>Bisnis Digital</option>
                    <option>Akuntansi</option>

                  </select>
                </td>
              </tr>

              <tr>
                <td>Alamat</td>
                <td>:</td>
                <td>
                  <textarea rows="5" cols="25"></textarea>
                </td>
              </tr>
            </table>

            <hr />

            <button type="submit">Kirim</button>
            <button type="reset">Reset</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
