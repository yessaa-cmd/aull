<!DOCTYPE html>
<html>
<head>
    <title>Form + Tabel</title>
</head>
<body>
    <h2>Form + Tabel</h2>
    <a href="index.html">Halaman Utama</a><br>
    <hr>
    <form>
        <table border="1">
            <tr>
                <td>Username</td>
                <td><input type="text" name="username"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <input type="radio" name="gender" value="Laki-laki"> Laki-laki
                    <input type="radio" name="gender" value="Perempuan"> Perempuan
                </td>
            </tr>
            <tr>
                <td>Hobi</td>
                <td>
                    <input type="checkbox" name="hobi" value="Menggambar"> Menggambar
                    <input type="checkbox" name="hobi" value="Membaca">Membaca
                    <input type="checkbox" name="hobi" value="Besepeda">Bersepeda
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td><textarea name="alamat" rows="4" cols="30"></textarea></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Kirim">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
